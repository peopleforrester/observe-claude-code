# ABOUTME: Project metadata and test dependencies for the observe-claude-code demo.
# ABOUTME: Offline unit tests run anywhere; `integration`-marked tests need the live VPS stack.
[project]
name = "observe-claude-code"
version = "0.1.0"
description = "Observing Claude Code in production with OpenTelemetry — AGNTCon NA 2026 demo"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs the live Compose stack, the Docker daemon or ~/repos (run on the VPS)",
]
